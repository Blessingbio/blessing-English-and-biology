name: Configure GitHub Pages branch publishing

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: pages-config
  cancel-in-progress: true

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Publish directly from the main branch
        run: |
          response_file="$RUNNER_TEMP/pages-response.json"
          status="$(
            curl --silent --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --request PUT \
              --header "Authorization: Bearer ${{ github.token }}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/pages" \
              --data '{"build_type":"legacy","source":{"branch":"main","path":"/"}}'
          )"
          cat "$response_file"
          if [[ "$status" != "204" ]]; then
            exit 1
          fi
